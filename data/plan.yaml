  - n: 3
    mon: 2026-10-26            # 26 Oct – 1 Nov
    meeting: ""          # team meeting date, e.g. 2026-10-29
    phase: Phase 2 · design
    milestone: RESET WEEK · 5 weeks to design approval
    load: full
    brief: >-
      Weeks 1 and 2 collapse into this one. Every item is something you can show at the next team meeting. Berkan's design notes (files 13–16 in the shared folder) are drafts: read the one that touches your part, check it, and say what's wrong. You are the one who decides whether it's right.
    teach: >-
      Berkan: the requirements chain in 10 minutes — why 660 nm, why 1 mW, why 100,000 pulses a second, why a 20 mrad beam.
    cells:
      berky:
        deliver: >-
          Demo Level 0: get the open-source SSDV tool (fsphil/ssdv on GitHub) running with Claude Code — a photo broken into packets and rebuilt, then rebuilt again with some packets deleted (grey squares, not a broken image); script and before/after photos in the repo for Arnav. Loan requests to the Supervisor in writing (telescope, mount, power meter, ND filters, 650–670 nm filter, LED + photodiode, any STM32 board). Email to the laser safety officer for one written line that Class 2 needs no permit. Transport Canada Form 26-0754E started. One-page demo script: what the audience sees, in order, at the Phase 2 presentation.
        learn: >-
          SSDV: how a photo becomes independent packets, and why a lost packet is a grey square.
        ask: Did the loan requests go out? They decide the budget.
      bilal:
        deliver: >-
          The receiver-to-board agreement (interface I-06), one page: the receiver turns laser light into a wire that switches high/low; that wire plugs into your STM32 board. Write down, for that wire: voltage of high and low (proposed 3.3 V / 0 V), what it does when the laser is off (proposed low), which STM32 pin reads it (must be a timer input-capture pin, which timestamps each change), how fast it changes (every 10 or 20 µs), the connector and pinout, and how both sides test it with a function generator. Start from the proposed values in file 14; Batu and Sbaz sign it. Plus a block diagram of your board: STM32, power, USB, debug port, I-06 connector, laser-driver connector.
        learn: STM32 timer input capture; read 01 §6.1 and owner card page 1.
        ask: >-
          Is it clear the board and I-06 are yours, not the receiver electronics?
      batu:
        deliver: >-
          An STM32 board outputting our data signal: a repeating test pattern in Manchester code (each bit sent as two half-bits, off-on or on-off, so there is always a change mid-bit) at 100,000 half-bits per second, i.e. 10 µs pulses, captured on a scope. Board: ask the team first (Bilal, Sbaz), then the ECE project rooms (H-857, H-803) via the Engineer in Residence, then buy a Nucleo (CAD 25–50). No board by Wednesday: firmware written and compiling, timer settings worked out. Also read the decoder approach in file 14 and say whether you agree.
        learn: >-
          Timer + DMA output on STM32; why Manchester lets the receiver find its own timing.
        ask: Do you have a board and a scope?
      sbaz:
        deliver: >-
          Choose the laser driver and draw it. The driver switches the laser on and off 100,000 times a second and sets its current; the hardware must make it impossible to exceed 1 mW even if software fails — that limit is our safety argument. Two options in file 16 §3: the iC-Haus iC-NZN chip (~CAD 10, current limit set by one resistor) or a discrete op-amp + transistor circuit (~CAD 5). Write a short recommendation (safety limit, switching speed, cost, ease of soldering), then the schematic and a simulation showing clean switching and the current never exceeding the limit (~12 mA for 1 mW on the proposed diode). Also read file 13's receiver numbers and flag anything that looks wrong.
        learn: >-
          Laser diode current vs light output; why the limit must be in hardware.
        ask: Which simulator will you use?
      matei:
        deliver: >-
          A Python script (OpenCV) using any webcam that finds a flashlight dot on a wall and prints its distance from the frame centre, 10 times a second, while you move the light. That distance is the pointing error the mount will correct. And a yes / no / maybe on borrowing a Sky-Watcher AZ-GTi mount (astronomy club, the Supervisor's lab, anyone).
        learn: Centroid of a bright blob; pixels to angle.
        ask: Any lead on a mount?
      arnav:
        deliver: >-
          The GitHub repository for all laptop software: created, whole team invited, folders laid out for decoder, image rebuild, stats panel, mount control, logging (02 §F). And the one-page agreement with Batu (interface I-07) on exactly what his board sends over USB; proposed format in file 14. Next week you build the screen around Berkan's Level 0 photo demo.
        learn: SSDV packet format; what the stats panel must show (01 §14).
        ask: What do you need from Batu or Berkan?

