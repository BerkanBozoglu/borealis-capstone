# Interfaces between subsystems (07 §3 "Interfaces"). The upstream owner drafts
# the one-line spec; the downstream owner edits it until they can build against
# it, adds their name, and sets status: agreed AND spec_hash (the site shows the
# hash to paste). If `what` changes later, the hash no longer matches and the
# build drops the interface back to draft automatically.
# status: agreed | draft | missing.  to: a subsystem id or a list of ids.

