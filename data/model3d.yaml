# 3D hardware model (#/model). Geometry lives in src/hw3d/scene.ts; every FACT lives here.
#
# Each object is one clickable piece of the model.
#   part:    the parts.yaml id it belongs to. The inspector shows that part's LIVE
#            availability, status, owner, chosen part and "changing it touches" chips,
#            so editing parts.yaml updates the 3D model on the next build.
#   alt_of:  set instead of part when the object is a Phase 1 alternative that has no
#            parts.yaml row of its own yet (e.g. the Fresnel lens, alternative to C1).
#            Lint warns until it gets a row.
#   config:  when it is drawn. rxA = telescope + GoTo mount, rxB = Fresnel + pan-tilt,
#            rx = both receivers, C1 / C2 / C3 = transmitter setups, tx = all three,
#            bench = power meter toggle.
#   dims:    [label, value, tag]. tag: source (datasheet/retailer, cite it in sources),
#            derived (calculated from other numbers), estimate (sized by eye for the model).
#   sources: keys of the sources map below.
# Names here are first names only (privacy check).

