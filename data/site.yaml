# Site-wide settings. Nothing here is a project number; project numbers live
# in register.yaml and the other data files.
title: BOREALIS systems dashboard
repo:
  owner: BerkanBozoglu
  name: borealis-capstone
  branch: main

# Layout of the map page (subsystem ids).
map:
  data_path: [transmitter, optics, receiver, firmware, ground]
  support_row: [tracking, power, safety]
  flight_row: [flight]

# Thresholds used by derived state and checks.
recent_days: 14          # "changed in last 14 days" filter
tbd_max_age_days: 30     # warn on TBD rows older than this
recent_commits: 10       # map page "recent changes"

# Subsystem status. broken (red) = a lint error, or one of these health
# checks failing on one of its rows. Everything else that needs attention
# (other warnings, stale rows, interfaces not agreed) is re-check (amber).
broken_checks:
  - c1-margin-negative   # link margin below 0 with committed values
  - filter-passband      # filter passband does not contain the laser wavelength

# The four workflow rules, verbatim from 07 §3.
workflow_cite: 07 §3
workflow_rules:
  - title: Own it → change it.
    text: >-
      The owner of a row edits `data/register.yaml` (on GitHub's web editor or via Claude Code),
      sets `changed` and `checked` to today, and writes one commit line in decision-log format:
      `TX-02: 200 → 1 mW · coordinator review, Class 2 baseline · Berky`
  - title: Don't own it → propose it.
    text: >-
      Open the sandbox, set the change, press *Propose*. A GitHub issue opens, assigned to the
      owner(s), with the share link and the modeled effect already in it. The owner commits or
      closes with a reason.
  - title: Downstream → re-check, not approve.
    text: >-
      When a row changes, every row in its `feeds_into` list becomes stale. Their owners see it in
      *Inbox* and in Discord. They clear it by re-checking their row (value may not change) and
      committing with `checked: today`.
  - title: Measured beats modeled.
    text: >-
      To record a measurement, change `tag: MEASURED`, fill `conditions:`, and link the evidence
      file under `evidence/`. Missing conditions = build fails = the change does not go live.

# The team's Claude Project (the "Ask the project assistant" buttons use it).
project_assistant_url: https://claude.ai/project/01a0c1f5-294f-71ea-8e04-1d1bc281ba53

# Hardware page (#/hardware). Lanes in display order, keyed by parts.yaml availability.
hardware:
  lanes:
    - {availability: available, label: Can use now}
    - {availability: candidate, label: Want to use}
    - {availability: choosing, label: Still choosing}
    - {availability: blocked, label: "Can't use as-is"}
  # filter pills: part id section letter → group
  groups:
    - {letter: A, label: Transmitter}
    - {letter: B, label: Receiver}
    - {letter: C, label: Optics & mount}
    - {letter: H, label: Test bench}
  flight_note: gated behind G1–G5

# Search palette: suggestion chips shown when the box is empty, and words
# dropped from queries.
search:
  suggestions: [receiver board, BPW34, azgti, who owns TIA, I-06, scope, nucleo, how do we order parts]
  stop_words: [who, owns, what, is, the, a, of, our, for, which, does, how, do, we, can, to]
  docs: [01_MASTER_CONTEXT, 02_COMPONENT_REGISTER, 04_ENGINEERING_PLAYBOOKS, 05_DECISION_LOG_and_OPEN_ITEMS]

# Doc pages (#/docs/…): a paragraph, list item or table row in docs/*.md that
# contains one of these Rev D.2 phrases gets "superseded by <ID>".
doc_superseded:
  # headings (regex) whose whole section is about the flight track, where 850 nm / 2 W stay current
  skip_headings: ["[Ff]light", "FLIGHT", "E-track", "BALLOON", "Extended track", "APD", "Dusk", "Three channels"]
  phrases:
    - {match: "850 nm", ids: [TX-01]}
    - {match: "≤200 mW", ids: [TX-02]}
    - {match: "200 mW", ids: [TX-02]}
    - {match: "Class 3B", ids: [SAF-01]}
    - {match: "850/40", ids: [OPT-03]}
    - {match: "~14 dB", ids: [LNK-02]}
    - {match: "14 dB margin", ids: [LNK-02]}
    - {match: "IR-transmitting", ids: [OPT-06]}

# BOM export header (#/bom). Blank fields are exported blank and flagged, never guessed.
bom:
  team_name: ""          # TODO: the team name as registered with the capstone office
  project: BOREALIS
  designed_by: ""        # TODO
  revision: ""           # TODO, e.g. A
